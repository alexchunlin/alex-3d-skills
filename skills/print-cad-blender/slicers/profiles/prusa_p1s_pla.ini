# PrusaSlicer config for `cad slice`: a P1S-sized bed, 0.4 nozzle, 0.20 mm layers, PLA. Generic values chosen to match
# Bambu's "0.20mm Standard" (2 walls, 5 top / 3 bottom layers, 15 % grid) closely enough for support and time checks;
# not a tuned print profile. Supports default off; `cad slice` passes --support-material for its second pass.
printer_technology = FFF
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
filament_diameter = 1.75
filament_density = 1.24
filament_type = PLA
temperature = 220
first_layer_temperature = 220
bed_temperature = 55
first_layer_bed_temperature = 55
perimeter_speed = 200
external_perimeter_speed = 150
infill_speed = 250
solid_infill_speed = 200
top_solid_infill_speed = 150
travel_speed = 400
first_layer_speed = 50
bridge_speed = 50
support_material = 0
support_material_auto = 1
support_material_threshold = 45
dont_support_bridges = 1
machine_max_acceleration_extruding = 10000
machine_max_acceleration_travel = 10000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
start_gcode = G28 ; cad slice: no printer-specific start code
end_gcode = M104 S0
